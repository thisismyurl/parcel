<!-- Header template part for Parcel.
     Storefront masthead: site title in Fraunces 600, navigation in DM Sans
     700. Paper background, hairline border at bottom. The nav is where a
     shop hangs "Menu" and "Order ahead" — no utility bar above it, because
     a café's most important information (hours, address) lives in the
     footer's roast band and the visit-us pattern, not buried in a strip
     nobody reads above the logo.

     The "Skip to content" link comes from WordPress itself: on a block theme
     core prints one (wp_enqueue_block_template_skip_link) pointing at the
     first content element, already translated. The theme's job is only to
     make it visible on focus, which assets/css/core/base.css does with its
     .skip-link rules. Nothing here renders it. -->
